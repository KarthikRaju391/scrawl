# The in-app updater only installs a DMG signed with the matching private key (Ed25519; tools/update-sign.swift).
# The private key lives outside the repo: ~/.config/scrawl/update-signing.key (mode 600). Public key, raw, base64:
UPDATE_PUBLIC_KEY="3dUcLFkRW1BymbataDqoiIYsTA6GVn5AqF8mn6kPmu4="

# Remote usage counts (docs/analytics.md): a PostHog project token ("phc_..."; public by design, it ships in the app).
# Release builds only: dev builds always leave it empty, so dev copies and agents' test builds send nothing.
POSTHOG_PROJECT_TOKEN=phc_tJNKct3bKri3qHiMm9uWgcfHvkvD5EbGYGF7D8EGowsH
# The project's region: EU Cloud (https://eu.i.posthog.com) or US Cloud (https://us.i.posthog.com).
